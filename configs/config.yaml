# Concept-Birth Forecasting — master configuration
# Plan: PLAN.md v2.1
#
# BINDING RULE (Principle 5): every threshold lives here. Changing a default
# requires a change to this file, which changes the config hash, which
# invalidates every downstream artifact's manifest.
#
# BINDING RULE (Principle 6, Goodhart guard): the `expected_bands` block below
# is DIAGNOSTIC ONLY. No parameter in this file may ever be tuned to move a
# measured quantity into a band. Out-of-band -> STOP, report, consult PI.

config_version: "2.1.0"

# --------------------------------------------------------------------------
# Phase 1 — Corpus
# --------------------------------------------------------------------------
corpus:
  source: kaggle_snapshot
  kaggle_ref: "Cornell-University/arxiv"
  kaggle_version: 299                 # snapshot lastUpdated 2026-08-15
  snapshot_file: "arxiv-metadata-oai-snapshot.json"
  categories: [cs.CL, cs.CV]          # primary OR cross-listed
  cross_list_ok: true
  date_field: "versions[0].created"   # v1 submission date ONLY
  corpus_cutoff: "2025-12-31"         # hard; drops partial 2026
  drop_withdrawn: true
  dedupe_on: "id"

# --------------------------------------------------------------------------
# Phase 2 — Candidate generation (permanent coinage ledger)
# --------------------------------------------------------------------------
candidates:
  strip_latex: true                   # BEFORE any extraction
  extractors: [rake, noun_chunks, ngrams]
  ngram_range: [2, 3]
  noun_chunk_pattern: "ADJ*NOUN+"
  normalization: "lower+light_lemma"  # no aggressive stemming
  provenance_tagged: true             # extractor agreement -> Phase 3 feature

  # PI decision 2026-08-19: postings are built by DICTIONARY RE-SCAN.
  # Extractors nominate CANDIDATES only; once a candidate exists, every
  # abstract is re-scanned by lemmatized string match to build complete
  # postings. Rationale: crystallization years must not inherit extractor
  # recall variance. Coinage = first re-scan occurrence (>= extractor recall).
  postings_mode: "dictionary_rescan"
  rescan_match: "lemmatized_token_sequence"
  rescan_word_boundary: true
  max_candidate_tokens: 5             # RAKE/noun-chunk phrases longer than this are not nominated
  spacy_model: "en_core_web_sm"       # tagger+lemmatizer only; parser/NER disabled

# --------------------------------------------------------------------------
# Phase 3 — Filtering + normalization (modeling vocabulary)
# --------------------------------------------------------------------------
vocabulary:
  min_total_freq: 9                   # papers; re-evaluated per origin as vocab_T
  c_value_enabled: true
  c_value_min: 0                      # PI decision 2026-08-19 at the Phase 3 gate.
                                      # Removes exactly the nested fragments C-value detects
                                      # (`fold cross`, `carlo tree`, `probability hypothesis`)
                                      # and nothing else: 1% of clusters, 99% of just-observable
                                      # ones retained. Higher floors are min_total_freq in disguise.
  pattern_kills:
    verb_led: true
    ordinals: true
    stopword_straddlers: true
    generic_heads: true
  kill_log: "logs/kills.jsonl"        # append-only, undo column

merges:
  # Evidence-dated membership. Global identity, time-gated activation.
  sources:
    string_variants: {enabled: true, effective: "timeless"}
    schwartz_hearst: {enabled: true, effective: "first_attesting_v1_date"}
    human_approved:  {enabled: true, effective: "cited_evidence_date"}
    embedding_similarity:
      enabled: true
      creates_merges: false           # HARD FALSE. Nominates to human queue only.
      role: "nominator"
  merge_gap_flag_years: 3             # coinage-date gap forcing human review
  # A paper containing >=2 members of one cluster contributes 1 to that
  # cluster's yearly count, not N. (PI-confirmed reading, 2026-08-19.)
  paper_dedupe_within_cluster: true
  merge_log: "logs/merges.jsonl"      # append-only, undo column

llm_judge:
  enabled: true                       # PI decision 2026-08-19, REVISED at the Phase 4 gate.
                                      # Deterministic rules could not separate `diffusion model`
                                      # from `thorough analysis` without killing the former, so the
                                      # judge was run after all -- in-session via subagents on the
                                      # Max plan, not the API. 106,960 terms judged, 34.0% dropped.
                                      # Hindsight audit CLEARS: keep-rate gaps of -0.008, -0.057,
                                      # -0.146 across the three adequately-populated strata, i.e.
                                      # declined concepts kept slightly MORE than persisted ones --
                                      # the opposite direction from familiarity bias.
  run_mode: "in_session_subagents"    # not the batch API; no API key involved
  verdicts: "data/interim/judge_verdicts.parquet"
  judge_off_arm:                      # preserved for report_both_arms
    vocab: "data/interim/vocab_nojudge/"
    registry: "data/registry/births_nojudge.parquet"
  criteria: ["not_a_noun_phrase", "generic"]
  forbidden_criteria: ["familiarity", "novelty", "importance"]
  audit_sample_n: 200
  report_both_arms: true

# --------------------------------------------------------------------------
# Phase 4 — Birth registry
# --------------------------------------------------------------------------
registry:
  k_year: 5
  m: 2
  # PI-confirmed reading, 2026-08-19: >= k_year papers in EACH of the m years
  # (not >= k_year*m pooled across the window).
  window_rule: "per_year"             # {per_year | pooled}
  min_groups: 2
  # PI-confirmed reading, 2026-08-19: author-group components computed ONCE,
  # pooled over all qualifying papers in t..t+m-1 (not per-year).
  groups_scope: "pooled_window"       # {pooled_window | per_year}
  author_match: "authors_parsed_exact"
  decline_rule: {reuses: [k_year, m]} # < k_year/yr for m consecutive yrs
  censoring_index: "t+m-1"            # complete through last_complete - (m-1)
  last_complete_year: 2025
  complete_through: 2024              # = 2025 - (2-1)
  rolling_12mo_dating: false          # v2 option, off by default
  audit_sample_n: 200
  spot_check_n: 20

# --------------------------------------------------------------------------
# Phase 5 — Graph construction
# --------------------------------------------------------------------------
graph:
  graph_window: 3                     # trailing years for graph_T
  max_concepts_per_paper: 25          # projection layer ONLY; keep lowest-DF
  cap_keeps: "lowest_document_frequency"
  weighting: "fractional"             # each paper spends exactly 1.0 edge mass
  # PI decision 2026-08-19 at the Phase 5 gate. binarize_min_weight=1.0 was
  # commented "one focused paper" and is exactly that for a 2-concept paper, but
  # the median paper carries 25 concepts and spreads 1.0 over C(25,2)=300 pairs
  # at 0.00333 each -- so the threshold demanded ~300 co-occurrences and left a
  # 230-node graph against a 15-40k band. Replaced by a scale-free rule that does
  # not depend on how many concepts a paper happens to carry.
  binarize_rule: "n_papers"           # {n_papers | weight}
  binarize_min_papers: 5              # an edge exists if >= 5 papers name both
  binarize_min_weight: 1.0            # retained for the weight-rule robustness arm

  # PI decision 2026-08-19: 36% of concept slots were a contiguous sub-phrase of
  # another concept on the SAME paper, so those pairs co-occurred by construction
  # and dominated the edge weights (the top neighbours of `object detection` were
  # `detection`, `object`, `object detector`). Such pairs now form no edge. Both
  # concepts remain nodes; the paper's 1.0 mass redistributes over its genuine
  # pairs, so the mass invariant is preserved.
  suppress_containment_edges: true

  # PI decision 2026-08-19 at the Phase 6 gate. Generic head nouns from the
  # Phase 2 suffix arm act as hubs -- `image` had degree 880, adjacent to 56% of
  # graph_2014 -- and clique percolation returned 2,403,400 maximal cliques on a
  # 1,571-node graph. Containment suppression does not touch these, because
  # image-classification is a real co-occurrence, just an uninformative one.
  # An edge is kept only when it exceeds chance given endpoint activity:
  #   lift = n_co * N_window / (papers(u) * papers(v))
  # This is the plan's own significance-relative-to-size idiom, one level below
  # the Phase 7 hypergeometric attachment test. lift>=5 is tractable at every
  # origin and retains 98% of nodes.
  edge_min_lift: 5.0
  time_decay: {enabled: false, half_life_years: null}   # robustness, off
  # INVARIANT (assert at build): total edge mass == n papers with >=2 concepts

# --------------------------------------------------------------------------
# Phase 6 — Regions
# --------------------------------------------------------------------------
regions:
  backend: "cpm"                      # pluggable: {cpm | link_communities}
  cpm_k: [3, 4, 5]
  cpm_impl: "custom_kclique"          # graph-tool not pip-installable; NOT networkx
  max_region_share: 0.20              # degeneracy guard on largest region
  lineage_jaccard: 0.30              # measured stability at k=4: 46.9% matched
  feature_spec_signed_off: true       # signed off 2026-08-19 (PI: "you can continue" after
                                      # reports/phase6_feature_spec.md was delivered). Two items
                                      # were flagged for attention and stand AS SPECIFIED unless
                                      # revised: (a) social_breadth is split out of pace-of-
                                      # collaboration and assigned to the +social ablation rung,
                                      # not +semantic_relational, because it is people-derived;
                                      # (b) confirmed-birth persistence uses crystallization
                                      # <= T-(m-1), not <= T, or every row imports a year of
                                      # future evidence (leakage checklist item 4).

embedder:
  # Per-origin, from scratch, CPU. No pretrained encoders anywhere, ever.
  algo: "word2vec"                    # or fasttext
  pretrained_allowed: false           # HARD FALSE
  dim: 200
  window: 5
  min_count: 5
  epochs: 5
  seed: 20260819

# --------------------------------------------------------------------------
# Phase 7 — Attachment + targets
# --------------------------------------------------------------------------
attachment:
  profile_n_papers: 20                # first N chronological papers
  profile_rank_by: "lift"             # NEVER raw counts (hub flooding)
  attach_top_k: 10
  attach_min_overlap: 3               # arm 1
  p_attach: 1.0e-3                    # arm 2: hypergeometric tail
  multi_attachment: true              # 1.0 target mass splits fractionally
  # INVARIANT (assert): total target mass == n attached births
  dual_attachment_floor: 10           # C2 gate: births/yr on tune origins
  relaxed_pair_rule: {enabled: false, overlaps: [3, 2]}   # armed only by C2 gate

# --------------------------------------------------------------------------
# Phase 8 — Models
# --------------------------------------------------------------------------
models:
  null_model: "poisson_glm"
  challengers: ["poisson_glm_structure", "gbm_poisson"]
  # Null boundary: null sees the unit's OWN count series only (exposure,
  # velocity, YoY-quarter acceleration, confirmed-birth persistence).
  # Challenger adds topology / cross-unit / people. Borderline -> null.
  ablation_ladder: ["null", "+semantic_relational", "+social", "+embedding"]
  seeds: [0, 1, 2, 3, 4]

# --------------------------------------------------------------------------
# Phase 9 — Evaluation
# --------------------------------------------------------------------------
evaluation:
  origin_step: 1
  horizons: [1, 2]
  origins_tune: [2014, 2018]          # inclusive range
  origins_test: [2019, 2024]          # inclusive range
  power_floor: 50                     # min crystallizations/yr in test origins
  # Staged unsealing — each origin opened EXACTLY ONCE. As of 2026-08-19 the
  # resolvable set is h=1 origins 2019-2023 and h=2 origins 2019-2022.
  unsealing:
    resolvable_now:  {h1: [2019, 2023], h2: [2019, 2022]}
    unseal_2027_01:  {h1: [2024, 2024], h2: [2023, 2023]}
    unseal_2028_01:  {h2: [2024, 2024]}
  bootstrap: {method: "block", blocks: ["region_lineage", "year"], n: 2000}
  regime_splits: [2017, 2020]
  headline_metric: "summed_per_unit_log_score_gain_over_null"
  roc_as_headline: false              # HARD FALSE

# --------------------------------------------------------------------------
# Diagnostic tripwires — NOT TARGETS (Principle 6). Never tune toward these.
# --------------------------------------------------------------------------
expected_bands:
  # RECALIBRATED 2026-08-19 by PI decision after the first Phase 1 run measured
  # 269,814 (filter + date field verified correct; shortfall is a property of the
  # corpus, not a defect). Band now guards against snapshot drift / filter
  # regression, not against the original estimate. Original band: [300000, 600000].
  phase1_papers_kept:        [255000, 285000]
  # RECALIBRATED 2026-08-19 by PI decision. vocab_T is a function of T, not a
  # constant: it grows 29x from 2014 to 2024 tracking a corpus that grows 19x.
  # No fixed C-value floor is inside the original [20000, 60000] at every origin.
  # The tripwire now guards the SHAPE of the curve -- a break between adjacent
  # origins -- rather than an absolute count. Original band: [20000, 60000].
  phase3_vocab_clusters_by_origin:
    2014: 3670
    2015: 5266
    2016: 7955
    2017: 12109
    2018: 18444
    2019: 26785
    2020: 37706
    2021: 49897
    2022: 63436
    2023: 81710
    2024: 105958
  phase3_vocab_tolerance: 0.15        # per-origin, vs the measured curve above
  phase3_vocab_growth_ratio: [1.20, 1.60]   # clusters(T)/clusters(T-1); a break here is the real signal
  phase4_crystallizations_yr: [100, 1000]
  phase5_nodes:              [15000, 40000]
  phase5_edges:              [100000, 1000000]
  phase6_regions_k4:         [100, 1000]
  phase6_region_size:        [10, 300]
  phase6_coverage:           [0.30, 0.70]

# --------------------------------------------------------------------------
# Runtime
# --------------------------------------------------------------------------
runtime:
  n_workers: 6                        # of 8 cores
  mem_budget_gb: 11
  storage: "parquet+duckdb"
  random_seed: 20260819
